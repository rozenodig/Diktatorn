  <!-- The app icon's drawing for the 16 and 32 px slots. The glyph is drawn on the 16 px pixel
       grid (scaled 64x), with a heavier tail and a square cursor, so its edges land on whole
       pixels at 16 and 32 px instead of blurring. After editing, run `npm run icons`. -->
