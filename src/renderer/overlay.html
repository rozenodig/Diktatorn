<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Diktatorn overlay</title>
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      :root { color-scheme: dark; } /* the pill is a dark HUD in both themes */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
      body { display: flex; align-items: center; justify-content: center; font: var(--weight-medium) var(--text-body) var(--font-ui); }
      .pill {
        display: flex; align-items: center; gap: 9px; padding: 9px 16px 9px 13px; border-radius: var(--radius-pill);
        color: var(--hud-text); background: var(--hud-surface); box-shadow: var(--hud-shadow);
        border: 1px solid var(--hud-border); white-space: nowrap; transition: opacity var(--duration-quick);
      }
      .icon { width: 10px; height: 10px; border-radius: 50%; flex: none; }
      [data-state="listening"] .icon { background: var(--grad); animation: pulse 1.1s ease-in-out infinite; }
      [data-state="handsFree"] .icon { background: var(--brand-mint); animation: pulse 1.6s ease-in-out infinite; }
      [data-state="processing"] .icon { border: 2px solid var(--hud-track); border-top-color: var(--brand-blue); width: 8px; height: 8px; animation: spin 0.8s linear infinite; }
      [data-state="done"] .icon { background: var(--hud-ok); }
      [data-state="error"] .icon { background: var(--hud-err); border-radius: 2px; }
      @keyframes pulse { 50% { transform: scale(0.65); opacity: 0.6; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .icon { animation: none !important; } }
    </style>
  </head>
  <body>
    <div class="pill" id="pill" data-state="listening" role="status" aria-live="polite">
      <span class="icon"></span><span id="text"></span>
    </div>
    <script type="module" src="./overlay.js"></script>
  </body>
</html>
