<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Diktatorn overlay</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
      body { display: flex; align-items: center; justify-content: center; font: 500 13px -apple-system, system-ui, sans-serif; }
      .pill {
        display: flex; align-items: center; gap: 9px; padding: 9px 16px 9px 13px; border-radius: 999px;
        color: #f5f5f7; background: rgba(28, 28, 30, 0.88); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.08); white-space: nowrap; transition: opacity 120ms;
      }
      .icon { width: 10px; height: 10px; border-radius: 50%; flex: none; }
      [data-state="listening"] .icon { background: #ff453a; animation: pulse 1.1s ease-in-out infinite; }
      [data-state="handsFree"] .icon { background: #ff9f0a; animation: pulse 1.6s ease-in-out infinite; }
      [data-state="processing"] .icon { border: 2px solid rgba(255, 255, 255, 0.25); border-top-color: #f5f5f7; width: 8px; height: 8px; animation: spin 0.8s linear infinite; }
      [data-state="done"] .icon { background: #30d158; }
      [data-state="error"] .icon { background: #ff453a; border-radius: 2px; }
      @keyframes pulse { 50% { transform: scale(0.65); opacity: 0.6; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .icon { animation: none !important; } }
    </style>
  </head>
  <body>
    <div class="pill" id="pill" data-state="listening" role="status" aria-live="polite">
      <span class="icon"></span><span id="text"></span>
    </div>
    <script type="module" src="./overlay.js"></script>
  </body>
</html>
